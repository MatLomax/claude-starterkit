name: ci

# Tests the installer on every platform it ships for, then installs through the real bootstraps
# (the curl | sh and irm | iex one-liners) against freshly built release assets, served locally
# the way GitHub serves them.

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  bootstrap-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install through the one-liner
        env:
          STARTERKIT_BASE_URL: http://127.0.0.1:8765
        run: |
          set -euo pipefail
          scripts/build-release.sh 0.0.0-ci "$RUNNER_TEMP/assets"
          (cd "$RUNNER_TEMP/assets" && exec python3 -m http.server 8765 >/dev/null 2>&1) &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null "$STARTERKIT_BASE_URL/install.sh"

          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          curl -fsSL "$STARTERKIT_BASE_URL/install.sh" | sh -s -- --no-plugins
          grep -qx '@./CLAUDE.starterkit.md' "$CLAUDE_CONFIG_DIR/CLAUDE.md"
          grep -qx '@./CLAUDE.starterkit-worklog.md' "$CLAUDE_CONFIG_DIR/CLAUDE.md"
          python3 - "$CLAUDE_CONFIG_DIR" <<'PY'
          import json, os, sys
          d = sys.argv[1]
          cfg = json.load(open(os.path.join(d, "settings.json")))
          cmds = [h["command"] for g in cfg["hooks"].values() for e in g for h in e["hooks"]]
          assert all(c.startswith("python3 " + os.path.join(d, "hooks")) for c in cmds), cmds
          for c in cmds:
              assert os.access(c.split(" ", 1)[1], os.X_OK), c
          assert cfg["statusLine"]["command"] == "bash " + os.path.join(d, "statusline-command.sh")
          assert cfg["extraKnownMarketplaces"]["matlomax"]
          print(len(cmds), "hooks wired")
          PY
          # A second run changes nothing.
          cp "$CLAUDE_CONFIG_DIR/settings.json" "$RUNNER_TEMP/first.json"
          curl -fsSL "$STARTERKIT_BASE_URL/install.sh" | sh -s -- --no-plugins
          diff "$RUNNER_TEMP/first.json" "$CLAUDE_CONFIG_DIR/settings.json"

          # ripwire through its own official installer, in a sandboxed HOME (Linux only: its
          # prebuilt binaries cover Linux and Apple-silicon macOS, and this keeps CI to one run).
          if [ "$RUNNER_OS" = Linux ]; then
            export HOME="$RUNNER_TEMP/home" CLAUDE_CONFIG_DIR="$RUNNER_TEMP/home/.claude"
            mkdir -p "$CLAUDE_CONFIG_DIR"
            curl -fsSL "$STARTERKIT_BASE_URL/install.sh" | sh -s -- --no-worklog --plugins=ripwire --plugin-hooks
            "$HOME/.local/bin/ripwire" --version
            grep -q ripwire "$CLAUDE_CONFIG_DIR/settings.json"
          fi

  bootstrap-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the release assets
        shell: bash
        run: scripts/build-release.sh 0.0.0-ci "$RUNNER_TEMP/assets"
      - name: Install through the one-liner
        shell: pwsh
        env:
          STARTERKIT_BASE_URL: http://127.0.0.1:8765
        run: |
          $ErrorActionPreference = "Stop"
          Start-Process python -ArgumentList "-m", "http.server", "8765" -WorkingDirectory (Join-Path $env:RUNNER_TEMP "assets") -WindowStyle Hidden
          curl.exe -fsS --retry 30 --retry-connrefused --retry-delay 1 -o NUL "$env:STARTERKIT_BASE_URL/install.ps1"
          if ($LASTEXITCODE -ne 0) { throw "asset server did not come up" }

          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "claude"
          irm "$env:STARTERKIT_BASE_URL/install.ps1" | iex
          if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }
          $md = Get-Content (Join-Path $env:CLAUDE_CONFIG_DIR "CLAUDE.md")
          if ($md -notcontains "@./CLAUDE.starterkit.md") { throw "CLAUDE.md import missing" }
          $cfg = Get-Content (Join-Path $env:CLAUDE_CONFIG_DIR "settings.json") -Raw | ConvertFrom-Json
          $cmds = $cfg.hooks.PSObject.Properties.Value | ForEach-Object { $_ } | ForEach-Object { $_.hooks } | ForEach-Object { $_.command }
          foreach ($c in $cmds) { if ($c -notmatch '^(py -3|python|python3) [A-Za-z]:/.+/hooks/[a-z-]+\.py$') { throw "bad hook command: $c" } }
          if ($cfg.statusLine.command -notmatch '-NoProfile -File ".+/statusline-command\.ps1"$') { throw "bad statusLine: $($cfg.statusLine.command)" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "statusline-command.ps1"))) { throw "statusline script missing" }
          Write-Host "$($cmds.Count) hooks wired"

          # Options through the scriptblock form.
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "claude2"
          & ([scriptblock]::Create((irm "$env:STARTERKIT_BASE_URL/install.ps1"))) -NoWorklog -NoPlugins
          if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }
          if (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "CLAUDE.starterkit-worklog.md")) { throw "-NoWorklog ignored" }
          # ripwire has no Windows installer: naming it fails, after the core install still ran.
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "claude3"
          & ([scriptblock]::Create((irm "$env:STARTERKIT_BASE_URL/install.ps1"))) -Plugins ripwire
          if ($LASTEXITCODE -eq 0) { throw "-Plugins ripwire must fail on Windows" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "settings.json"))) { throw "core install skipped" }
          # Options match like PowerShell parameters: any case, and the -Name:value form.
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "claude5"
          & ([scriptblock]::Create((irm "$env:STARTERKIT_BASE_URL/install.ps1"))) -noworklog:$true -plugins:ripwire
          if ($LASTEXITCODE -eq 0) { throw "-plugins:ripwire must fail on Windows" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "settings.json"))) { throw "core install skipped" }
          if (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "CLAUDE.starterkit-worklog.md")) { throw "-noworklog:`$true ignored" }
          # An unknown option is an error before anything is downloaded or installed.
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "claude6"
          $failed = $false
          try { & ([scriptblock]::Create((irm "$env:STARTERKIT_BASE_URL/install.ps1"))) -NoWorklg } catch { $failed = $_.Exception.Message -match "unknown option '-NoWorklg'" }
          if (-not $failed) { throw "an unknown option was not rejected" }
          if (Test-Path $env:CLAUDE_CONFIG_DIR) { throw "installed despite an unknown option" }
          # irm | iex inside the user's own script or function: their arguments are not installer
          # options, and the installer does not exit their script.
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "claude7"
          $setup = Join-Path $env:RUNNER_TEMP "setup.ps1"
          $marker = Join-Path $env:RUNNER_TEMP "setup-continued"
          Set-Content $setup 'irm "$env:STARTERKIT_BASE_URL/install.ps1" | iex; if ($LASTEXITCODE -ne 0) { exit 7 }; Set-Content $env:SETUP_MARKER "yes"; exit 0'
          $env:SETUP_MARKER = $marker
          pwsh -NoProfile -File $setup -Force
          if ($LASTEXITCODE -ne 0) { throw "irm | iex inside a script run with -Force exited $LASTEXITCODE" }
          if (-not (Test-Path $marker)) { throw "irm | iex ended the user's script" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "CLAUDE.starterkit-worklog.md"))) { throw "default options not applied" }
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "claude8"
          function Install-Tools { irm "$env:STARTERKIT_BASE_URL/install.ps1" | iex }
          Install-Tools -NoWorklog
          if ($LASTEXITCODE -ne 0) { throw "irm | iex inside a function exited $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "CLAUDE.starterkit-worklog.md"))) { throw "the wrapper function's -NoWorklog was applied as an installer option" }
          $global:LASTEXITCODE = 0
          Write-Host "options passed through"

          # irm | iex and the scriptblock form run in the caller's session: they must leave no settings
          # or variables behind, including under Set-StrictMode -Version Latest.
          $check = '; if ($ErrorActionPreference -ne "Continue") { exit 3 }; foreach ($v in "tmp","exe","argv","asFile","rawArgs","WithWorklog","NoWorklog","Plugins","NoPlugins","PluginHooks") { if (Test-Path "variable:$v") { Write-Host "left behind: $v"; exit 4 } }; exit $LASTEXITCODE'
          $runs = [ordered]@{
            "irm | iex" = 'irm "$env:STARTERKIT_BASE_URL/install.ps1" | iex'
            "scriptblock form" = '& ([scriptblock]::Create((irm "$env:STARTERKIT_BASE_URL/install.ps1"))) -NoWorklog -NoPlugins'
            "irm | iex under StrictMode" = 'Set-StrictMode -Version Latest; irm "$env:STARTERKIT_BASE_URL/install.ps1" | iex'
          }
          $n = 10
          foreach ($run in $runs.GetEnumerator()) {
            $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "claude$n"
            $n++
            pwsh -NoProfile -Command ($run.Value + $check)
            if ($LASTEXITCODE -ne 0) { throw "$($run.Key) failed or changed the caller's session (exit $LASTEXITCODE)" }
            if (-not (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "settings.json"))) { throw "$($run.Key) did not install" }
          }
          Write-Host "no session leak"
      - name: Install under Windows PowerShell 5.1 (one-liner and file form)
        shell: powershell
        env:
          STARTERKIT_BASE_URL: http://127.0.0.1:8766
        run: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSEdition -ne "Desktop" -or $PSVersionTable.PSVersion.Major -ne 5) { throw "not Windows PowerShell 5.1: $($PSVersionTable.PSVersion)" }
          Start-Process python -ArgumentList "-m", "http.server", "8766" -WorkingDirectory (Join-Path $env:RUNNER_TEMP "assets") -WindowStyle Hidden
          curl.exe -fsS --retry 30 --retry-connrefused --retry-delay 1 -o NUL "$env:STARTERKIT_BASE_URL/install.ps1"
          if ($LASTEXITCODE -ne 0) { throw "asset server did not come up" }

          # The checks the pwsh step makes on a default install.
          function Assert-Installed([string]$dir, [bool]$worklog) {
            $md = Get-Content (Join-Path $dir "CLAUDE.md")
            if ($md -notcontains "@./CLAUDE.starterkit.md") { throw "CLAUDE.md import missing in $dir" }
            $hasWorklog = Test-Path (Join-Path $dir "CLAUDE.starterkit-worklog.md")
            if ($hasWorklog -ne $worklog) { throw "worklog add-on installed=$hasWorklog in $dir, want $worklog" }
            $cfg = Get-Content (Join-Path $dir "settings.json") -Raw | ConvertFrom-Json
            $cmds = @($cfg.hooks.PSObject.Properties.Value | ForEach-Object { $_ } | ForEach-Object { $_.hooks } | ForEach-Object { $_.command })
            if ($cmds.Count -eq 0) { throw "no hooks wired in $dir" }
            foreach ($c in $cmds) { if ($c -notmatch '^(py -3|python|python3) [A-Za-z]:/.+/hooks/[a-z-]+\.py$') { throw "bad hook command: $c" } }
            if ($cfg.statusLine.command -notmatch '-NoProfile -File ".+/statusline-command\.ps1"$') { throw "bad statusLine: $($cfg.statusLine.command)" }
            if (-not (Test-Path (Join-Path $dir "statusline-command.ps1"))) { throw "statusline script missing in $dir" }
            Write-Host "$dir : $($cmds.Count) hooks wired"
          }

          # The documented one-liner.
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "ps51-claude1"
          irm "$env:STARTERKIT_BASE_URL/install.ps1" | iex
          if ($LASTEXITCODE -ne 0) { throw "irm | iex: installer exited $LASTEXITCODE" }
          Assert-Installed $env:CLAUDE_CONFIG_DIR $true

          # Options through the scriptblock form.
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "ps51-claude2"
          & ([scriptblock]::Create((irm "$env:STARTERKIT_BASE_URL/install.ps1"))) -NoWorklog -NoPlugins
          if ($LASTEXITCODE -ne 0) { throw "scriptblock form: installer exited $LASTEXITCODE" }
          Assert-Installed $env:CLAUDE_CONFIG_DIR $false

          # The file form: options applied, and the installer's exit code is the script's.
          $dl = Join-Path $env:RUNNER_TEMP "ps51-download"
          New-Item -ItemType Directory -Path $dl | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "$env:STARTERKIT_BASE_URL/install.ps1" -OutFile (Join-Path $dl "install.ps1")
          Set-Location $dl
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "ps51-claude3"
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -NoWorklog -NoPlugins
          if ($LASTEXITCODE -ne 0) { throw "file form exited $LASTEXITCODE" }
          Assert-Installed $env:CLAUDE_CONFIG_DIR $false
          # ripwire has no Windows installer, so the installer exits 1 after the core install.
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "ps51-claude4"
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -NoWorklog -Plugins ripwire
          if ($LASTEXITCODE -ne 1) { throw "file form with -Plugins ripwire exited $LASTEXITCODE, want the installer's 1" }
          Assert-Installed $env:CLAUDE_CONFIG_DIR $false
          $global:LASTEXITCODE = 0
          Write-Host "Windows PowerShell 5.1 installs work"
