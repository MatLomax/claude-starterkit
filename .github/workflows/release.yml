name: release

# Changelog-driven release. On a push to main it reads the first versioned
# heading in CHANGELOG.md; if that version has no tag yet it tags the commit,
# builds the installer for every platform and publishes the GitHub release, with
# the version's changelog section as the notes and the installer binaries, their
# .sha256 files and the install.sh / install.ps1 bootstraps attached. Cutting a release
# is therefore just: move the [Unreleased] entries under a new "## [X.Y.Z]"
# heading and push to main. Tagging and publishing happen in one job, so the
# default GITHUB_TOKEN is enough (a tag it pushes never needs to trigger another
# workflow).
#
# workflow_dispatch publishes (or re-publishes) the release for an existing tag,
# built from that tag's own tree.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tagged version to publish, e.g. 0.5.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so an existing release tag is visible

      - name: Resolve the version and tag it if new
        id: ver
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
            if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "Tag v$version does not exist; dispatch only publishes existing tags." >&2
              exit 1
            fi
            git checkout -q "v$version"
          else
            # The first versioned heading, skipping a leading "## [Unreleased]".
            version="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
            if [ -z "$version" ]; then
              echo "No versioned changelog heading; nothing to release."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "v$version is already tagged; nothing to release."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$version" -m "v$version"
            git push origin "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Tags from before the Go installer (0.5.x and earlier) have no go.mod; a dispatch
      # re-publish of one builds that tag's own zip bundle with its make_bundle.py.
      - name: Set up Go
        if: steps.ver.outputs.version != '' && hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test and build the release assets
        if: steps.ver.outputs.version != ''
        run: |
          set -euo pipefail
          if [ -f go.mod ]; then
            go vet ./...
            go test ./...
            scripts/build-release.sh "${{ steps.ver.outputs.version }}" dist
          else
            python3 make_bundle.py
          fi

      - name: Extract the changelog section
        if: steps.ver.outputs.version != ''
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { cap = 1; next }
            cap && (/^## \[/ || /^\[[^]]*\]: /) { cap = 0 }
            cap { print }
          ' CHANGELOG.md > release_notes.md
          sed -i -e '/./,$!d' release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for $VERSION" >&2
            exit 1
          fi
          cat release_notes.md

      - name: Publish the GitHub release
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body_path: release_notes.md
          files: dist/*
          # A new version is the latest release; a dispatch backfill of an older tag never is.
          make_latest: ${{ github.event_name == 'push' }}
